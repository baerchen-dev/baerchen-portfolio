# Despliegue en baerchen.dev desde cPanel → Git Version Control → Deploy HEAD Commit.
# Copia solo lo que usa la web (sin node_modules, src, package.json ni CLAUDE.md).
# Si se crea una plantilla .php nueva en la raíz del tema, hay que añadirla a la última línea.
deployment:
  tasks:
    - export DEPLOYPATH=/home/baerchen/public_html/wp-content/themes/baerchen/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R acf-json assets components inc sections $DEPLOYPATH
    - /bin/cp footer.php front-page.php functions.php header.php index.php page-contacto.php page-sobre-mi.php page-trabajos.php single-proyecto.php style.css screenshot.jpg $DEPLOYPATH
